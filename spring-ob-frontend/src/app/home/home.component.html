<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Feed</title>
  </head>
  <body>
    <div class="side-menu">
      <ul>
        <li><a href="#"><i class="fas fa-home"></i>Home</a></li>
        <li><a href="#"><i class="fas fa-user"></i>Profile</a></li>
      </ul>
    </div>
    <div class="feed">
      <div class="post">
        <div class="post-header">
          <img src="https://via.placeholder.com/40" alt="User">
          <div class="user-info">
            <strong>username</strong>
            <span>Posted 21h ago in Firenze, Italia</span>
          </div>
        </div>
        <div class="post-image">
          <img src="https://via.placeholder.com/400x200" alt="Post Image">
        </div>
        <div class="post-description">This is the description of the post...</div>
        <div class="post-interactions">
          ❤️ 123 Likes • 💬 45 Comments
        </div>
        <div class="comments-section">
          <div class="comment"><strong>User1:</strong> Nice pic!</div>
          <div class="comment"><strong>User2:</strong> Amazing!</div>
          <div class="view-more" (click)="openPopup()">View more comments</div>
          <div class="comment-input">
            <input type="text" placeholder="Add a comment...">
            <button>Post</button>
          </div>
        </div>
      </div>
    </div>
    <div class="popup-overlay" *ngIf="isPopupVisible">
      <div class="popup-content">
        <div class="popup-close">
          <button (click)="closePopup()">✖</button>
        </div>
        <h3>All Comments</h3>
        <div class="comment"><strong>User1:</strong> Nice pic!</div>
        <div class="comment"><strong>User2:</strong> Amazing!</div>
        <div class="comment"><strong>User3:</strong> Looks great!</div>
        <div class="comment"><strong>User4:</strong> Wow, stunning!</div>
      </div>
    </div>

  </body>
</html>
