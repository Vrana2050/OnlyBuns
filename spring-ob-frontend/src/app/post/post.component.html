<div class="container">
    <h2>Create a New Post</h2>
    <form [formGroup]="postForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data">
      <div class="form-group">
        <label for="description">Description:</label>
        <input type="text" id="description" formControlName="description" class="form-control" required>
      </div>
  
      <div class="form-group">
        <label for="image">Upload Image:</label>
        <input type="file" id="image" (change)="onFileSelected($event)" accept="image/*" class="form-control" required>
      </div>
  
      <button type="submit" class="btn btn-primary">Create Post</button>
    </form>
  </div>
  <app-map (coordinatesExported)="getCords($event)"></app-map>
