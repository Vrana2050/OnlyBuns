<div class="profile-card">
    <div class="avatar">
      <img src="https://via.placeholder.com/100" alt="User Avatar" />
    </div>
    <div class="user-info">
      <h2>{{ user.firstName }} {{ user.lastName }}</h2>
      <p>@{{ user.username }}</p>
      <p>Location: {{ user.address || "Unknown" }}</p>
      <p>Posts: {{ user.numberOfPosts }}</p>
      <p>Following: {{ user.numberOfFollowing }}</p>
      <p>Mood: {{ user.numberOfPosts > 10 ? "🌞" : "🌥️" }}</p>
    </div>
  </div>
