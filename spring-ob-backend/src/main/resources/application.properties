#Prometheus postavke
management.metrics.export.prometheus.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoints.web.base-path=/actuator
management.endpoints.web.path-mapping.prometheus=prometheus
spring.security.user.name=admin
spring.security.user.password=admin
management.metrics.enable.process.cpu.usage=true
management.endpoint.health.show-details=always
management.endpoint.prometheus.sensitive=false
management.endpoints.web.exposure.include=*



#RateLimiter
# maksimalan broj poziva
resilience4j.ratelimiter.instances.comment.limitForPeriod=60

# u okviru vremenskog intervala
resilience4j.ratelimiter.instances.comment.limitRefreshPeriod=1h

# vreme cekanja na odgovor (recimo: u slucaju da je poziv stigao u 59 sekundi, a interval traje 60)
resilience4j.ratelimiter.instances.standard.timeoutDuration=0


