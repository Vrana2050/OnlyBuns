#Spring DataSource
server.port = 8082
spring.datasource.driverClassName=org.postgresql.Driver


broker.url = http://localhost:8084

spring.jpa.properties.hibernate.connection.isolation=TRANSACTION_SERIALIZABLE


spring.datasource.initialization-mode=always
spring.datasource.platform=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/onlybuns-v1
spring.datasource.username=postgres
